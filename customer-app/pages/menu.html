<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Menu — Aharam</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
</head>
<body>

<header class="header"><div class="container header-inner">
  <a href="../index.html" class="logo">🍽 <span data-pname>Aharam</span></a>
  <nav class="header-nav">
    <a href="orders.html" class="nav-link">My Orders</a>
    <button class="btn btn-primary" id="viewCartBtn">🛒 Cart <span class="badge" id="cartBadge">0</span></button>
  </nav>
</div></header>

<!-- Restaurant Info Bar -->
<div id="restInfoBar" style="background:#fff;border-bottom:1px solid #eee;padding:16px 0">
  <div class="container" style="display:flex;align-items:center;gap:16px">
    <div id="restLogo" style="font-size:40px">🍽</div>
    <div>
      <h1 id="restName" style="font-size:22px;font-weight:700">Loading...</h1>
      <p id="restMeta" style="font-size:13px;color:#777"></p>
    </div>
    <div style="margin-left:auto;text-align:right">
      <div id="restRating" style="font-size:18px;font-weight:700;color:#4caf50"></div>
      <div id="restStatus" style="font-size:12px;font-weight:700"></div>
    </div>
  </div>
</div>

<!-- Category Nav -->
<div style="background:#fff;border-bottom:1px solid #eee;overflow-x:auto;white-space:nowrap;padding:0 16px">
  <div class="container" id="categoryNav" style="display:flex;gap:4px;padding:8px 0"></div>
</div>

<!-- Menu Content + Cart Sidebar -->
<div class="container" style="padding-top:24px;padding-bottom:24px">
  <div class="two-col">

    <!-- Menu Items -->
    <div id="menuContent">
      <div class="loading-spinner">Loading menu...</div>
    </div>

    <!-- Cart Sidebar (desktop) -->
    <div id="cartSidebar" style="position:sticky;top:80px">
      <div class="card">
        <h3 style="font-size:16px;font-weight:700;margin-bottom:16px">🛒 Your Cart</h3>
        <div id="sidebarCartItems">
          <p style="color:#777;font-size:14px;text-align:center;padding:20px 0">Your cart is empty</p>
        </div>
        <div id="sidebarCartFooter" style="display:none">
          <div class="price-breakdown">
            <div class="price-row"><span>Food total</span><span id="sbFoodTotal">₹0</span></div>
            <div class="price-row"><span>Delivery fee</span><span id="sbDelivery">₹0</span></div>
            <div class="price-row"><span>Platform fee</span><span id="sbPlatformFee">₹5</span></div>
            <div class="price-row total"><span>Total</span><span id="sbTotal">₹0</span></div>
          </div>
          <button class="btn btn-primary btn-block btn-lg" onclick="proceedToCheckout()">
            Proceed to Checkout →
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Customer Reviews Section -->
<div class="container" style="max-width:760px;padding-bottom:60px">
  <div id="reviewsSection" style="display:none">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <h2 style="font-size:18px;font-weight:800">Customer Reviews</h2>
      <div id="reviewsRatingSummary" style="display:flex;align-items:center;gap:8px"></div>
    </div>
    <div id="reviewsList" style="display:flex;flex-direction:column;gap:12px"></div>
  </div>
</div>

<!-- Item Detail Modal -->
<div class="modal" id="itemModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="itemModalName">Item</h3>
      <button class="modal-close" onclick="closeItemModal()">✕</button>
    </div>
    <div id="itemModalImg" style="height:180px;background:#eee;border-radius:8px;margin-bottom:16px;overflow:hidden"></div>
    <p id="itemModalDesc" style="font-size:14px;color:#777;margin-bottom:12px"></p>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <div style="font-size:22px;font-weight:700;color:#ff5722" id="itemModalPrice"></div>
      <div class="qty-control">
        <button class="qty-btn" id="modalQtyMinus">−</button>
        <span class="qty-num" id="modalQty">1</span>
        <button class="qty-btn" id="modalQtyPlus">+</button>
      </div>
    </div>
    <textarea class="form-control" id="itemModalNotes" placeholder="Special instructions (optional)..." rows="2"></textarea>
    <button class="btn btn-primary btn-block btn-lg" style="margin-top:12px" id="modalAddBtn">
      Add to Cart — ₹<span id="modalTotalPrice"></span>
    </button>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/platform.js"></script>
<script src="../js/auth.js"></script>
<script>
const params       = new URLSearchParams(location.search);
const restaurantId = parseInt(params.get('restaurant_id') || '0');
let   cartData     = { items: [], food_total: 0 };
let   currentItem  = null;
let   modalQty     = 1;

if (!restaurantId) {
  window.location.href = '../index.html';
}

// ── Load Restaurant Info ─────────────────────────────────
async function loadRestaurant() {
  const res = await Api.restaurants.show(restaurantId);
  if (!res?.success) { window.location.href = '../index.html'; return; }

  const r = res.data;
  document.title = `${r.name} — ${window._platformName || 'Aharam'}`;
  document.getElementById('restName').textContent = r.name;
  document.getElementById('restMeta').textContent = `${r.cuisine_type || ''} • ${r.avg_delivery_time} min delivery • Min ₹${r.min_order_amount}`;
  document.getElementById('restRating').textContent = `⭐ ${parseFloat(r.avg_rating||0).toFixed(1)}`;
  const isOpen = r.is_open;
  const statusEl = document.getElementById('restStatus');
  statusEl.textContent    = isOpen ? '● Currently Open' : '● Closed';
  statusEl.style.color    = isOpen ? '#4caf50' : '#f44336';
  if (r.logo_image) {
    document.getElementById('restLogo').innerHTML = `<img src="${r.logo_image}" style="width:60px;height:60px;border-radius:8px;object-fit:cover"/>`;
  }
}

// ── Load Menu ────────────────────────────────────────────
async function loadMenu() {
  const res = await Api.menu.get(restaurantId);
  if (!res?.success) { document.getElementById('menuContent').innerHTML='<p>Could not load menu.</p>'; return; }

  const categories = res.data.categories;
  const catNav     = document.getElementById('categoryNav');
  const content    = document.getElementById('menuContent');

  catNav.innerHTML = categories.map(c =>
    `<button class="tab-btn" onclick="scrollToCategory('cat-${c.id}')">${escHtml(c.name)}</button>`
  ).join('');

  content.innerHTML = categories.map(cat => `
    <div id="cat-${cat.id}" style="margin-bottom:32px">
      <h2 style="font-size:18px;font-weight:700;margin-bottom:16px;padding-bottom:8px;border-bottom:2px solid #ff5722">${escHtml(cat.name)}</h2>
      <div style="display:flex;flex-direction:column;gap:12px">
        ${cat.items.map(renderMenuItem).join('')}
      </div>
    </div>`).join('');
}

function renderMenuItem(item) {
  const vegClass = item.food_type === 'veg' ? 'veg' : item.food_type === 'egg' ? 'egg' : 'non_veg';
  const strike   = item.discount_price ? `<span style="text-decoration:line-through;color:#aaa;font-size:13px;margin-right:6px">₹${item.price}</span>` : '';
  const price    = item.discount_price || item.price;
  const bestseller = item.is_bestseller ? '<span style="background:#ff5722;color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;margin-left:8px">BESTSELLER</span>' : '';

  return `
    <div class="card" style="padding:14px;cursor:pointer" onclick="openItemModal(${JSON.stringify(item).replace(/"/g,'&quot;')})">
      <div style="display:flex;gap:12px;align-items:center">
        <div style="flex:1">
          <div style="display:flex;align-items:center;margin-bottom:4px">
            <span class="veg-dot ${vegClass}" style="flex-shrink:0"></span>
            <span style="font-size:15px;font-weight:600">${escHtml(item.name)}</span>
            ${bestseller}
          </div>
          <div style="font-size:13px;color:#777;margin-bottom:8px">${escHtml(item.description||'')}</div>
          <div style="font-size:15px;font-weight:700;color:#ff5722">${strike}₹${price}</div>
        </div>
        <div style="flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:8px">
          ${item.image
            ? `<div style="width:90px;height:90px;border-radius:10px;overflow:hidden;background:#f5f5f5"><img src="${item.image}" style="width:100%;height:100%;object-fit:cover;display:block" onerror="this.parentElement.innerHTML='<div style=\\'display:flex;align-items:center;justify-content:center;height:100%;font-size:32px\\'>🍽</div>'"/></div>`
            : `<div style="width:90px;height:90px;background:#f5f5f5;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:32px">🍽</div>`}
          <button class="btn btn-outline" style="width:90px;padding:6px;font-size:13px" onclick="event.stopPropagation();openItemModal(${JSON.stringify(item).replace(/"/g,'&quot;')})">ADD +</button>
        </div>
      </div>
    </div>`;
}

// ── Item Modal ───────────────────────────────────────────
function openItemModal(item) {
  currentItem = item;
  modalQty    = 1;

  document.getElementById('itemModalName').textContent = item.name;
  document.getElementById('itemModalDesc').textContent = item.description || '';
  document.getElementById('itemModalPrice').textContent = `₹${item.discount_price || item.price}`;
  document.getElementById('itemModalImg').innerHTML = item.image
    ? `<img src="${item.image}" style="width:100%;height:100%;object-fit:cover"/>`
    : `<div style="width:100%;height:100%;background:#f5f5f5;display:flex;align-items:center;justify-content:center;font-size:60px">🍽</div>`;
  document.getElementById('modalQty').textContent = modalQty;

  const btn = document.getElementById('modalAddBtn');
  btn.disabled = false;
  btn.innerHTML = `Add to Cart — ₹<span id="modalTotalPrice">${item.discount_price || item.price}</span>`;

  document.getElementById('itemModal').classList.add('active');
}

function closeItemModal() { document.getElementById('itemModal').classList.remove('active'); }

function updateModalTotal() {
  if (!currentItem) return;
  const price = currentItem.discount_price || currentItem.price;
  document.getElementById('modalTotalPrice').textContent = (price * modalQty).toFixed(0);
}

document.getElementById('modalQtyPlus').addEventListener('click', () => {
  if (modalQty < 10) { modalQty++; document.getElementById('modalQty').textContent = modalQty; updateModalTotal(); }
});
document.getElementById('modalQtyMinus').addEventListener('click', () => {
  if (modalQty > 1) { modalQty--; document.getElementById('modalQty').textContent = modalQty; updateModalTotal(); }
});

async function addCurrentItemToCart() {
  const btn = document.getElementById('modalAddBtn');
  btn.disabled = true;
  btn.innerHTML = 'Adding...';

  const res = await Api.cart.add({
    menu_item_id: currentItem.id,
    quantity:     modalQty,
    notes:        document.getElementById('itemModalNotes').value,
  });

  if (res?.success) {
    cartData = res.data;
    updateSidebarCart();
    closeItemModal();
    showToast(`${currentItem.name} added to cart!`, 'success');
  } else if (res?.status === 409 || res?.message?.includes('another restaurant')) {
    btn.disabled = false;
    btn.innerHTML = `Add to Cart — ₹<span id="modalTotalPrice">${(currentItem.discount_price||currentItem.price)*modalQty}</span>`;
    showClearCartConfirm();
  } else {
    showToast(res?.message || 'Failed to add item.', 'error');
    btn.disabled = false;
    btn.innerHTML = `Add to Cart — ₹<span id="modalTotalPrice">${(currentItem.discount_price||currentItem.price)*modalQty}</span>`;
  }
}

function showClearCartConfirm() {
  const existing = document.getElementById('clearCartConfirm');
  if (existing) existing.remove();

  const overlay = document.createElement('div');
  overlay.id = 'clearCartConfirm';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px';
  overlay.innerHTML = `
    <div style="background:#fff;border-radius:16px;padding:28px 24px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.2)">
      <div style="font-size:36px;text-align:center;margin-bottom:12px">🛒</div>
      <h3 style="font-size:18px;font-weight:700;text-align:center;margin-bottom:8px">Start a new cart?</h3>
      <p style="font-size:14px;color:#777;text-align:center;margin-bottom:24px;line-height:1.5">
        Your cart has items from another restaurant.<br>
        Adding this item will clear your current cart.
      </p>
      <div style="display:flex;gap:12px">
        <button onclick="document.getElementById('clearCartConfirm').remove()"
          style="flex:1;padding:12px;border:2px solid #e0e0e0;border-radius:10px;background:#fff;font-size:15px;font-weight:600;cursor:pointer;color:#555">
          No, keep it
        </button>
        <button onclick="clearAndAdd()"
          style="flex:1;padding:12px;border:none;border-radius:10px;background:#ff5722;color:#fff;font-size:15px;font-weight:700;cursor:pointer">
          Yes, clear & add
        </button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
}

async function clearAndAdd() {
  document.getElementById('clearCartConfirm')?.remove();
  await Api.cart.clear();
  cartData = { items: [], food_total: 0 };
  updateSidebarCart();
  await addCurrentItemToCart();
}

document.getElementById('modalAddBtn').addEventListener('click', async () => {
  if (!Auth.requireLogin()) return;
  const btn = document.getElementById('modalAddBtn');
  if (btn.disabled) return;
  await addCurrentItemToCart();
});

// ── Sidebar Cart ─────────────────────────────────────────
async function loadCart() {
  if (!Auth.isLoggedIn()) return;
  const res = await Api.cart.get();
  if (res?.success) { cartData = res.data; updateSidebarCart(); }
}

function updateSidebarCart() {
  const items      = cartData.items || [];
  const itemsEl    = document.getElementById('sidebarCartItems');
  const footerEl   = document.getElementById('sidebarCartFooter');
  const badgeEl    = document.getElementById('cartBadge');

  if (badgeEl) badgeEl.textContent = cartData.item_count || 0;

  if (!items.length) {
    itemsEl.innerHTML  = '<p style="color:#777;font-size:14px;text-align:center;padding:20px 0">Your cart is empty</p>';
    footerEl.style.display = 'none';
    return;
  }

  itemsEl.innerHTML = items.map(item => `
    <div class="cart-item">
      <span class="veg-dot ${item.food_type === 'veg' ? 'veg' : 'non_veg'}"></span>
      <span class="cart-item-name">${escHtml(item.name)}</span>
      <div class="qty-control">
        <button class="qty-btn" onclick="changeQty(${item.menu_item_id}, ${item.quantity - 1})">−</button>
        <span class="qty-num">${item.quantity}</span>
        <button class="qty-btn" onclick="changeQty(${item.menu_item_id}, ${item.quantity + 1})">+</button>
      </div>
      <span class="cart-item-price">₹${item.subtotal}</span>
    </div>`).join('');

  const pFee = calcPlatformFee(cartData.food_total);
  document.getElementById('sbFoodTotal').textContent    = `₹${cartData.food_total}`;
  const freeAbove   = window._freeDeliveryAbove ?? 299;
  const baseFee     = window._baseDeliveryFee   ?? 30;
  const deliveryFee = cartData.food_total >= freeAbove ? 0 : baseFee;
  document.getElementById('sbDelivery').textContent     = deliveryFee === 0 ? 'FREE' : `₹${deliveryFee}`;
  document.getElementById('sbPlatformFee').textContent  = `₹${pFee}`;
  document.getElementById('sbTotal').textContent        = `₹${(cartData.food_total + deliveryFee + pFee).toFixed(0)}`;

  footerEl.style.display = 'block';
}

async function changeQty(menuItemId, qty) {
  const res = await Api.cart.update({ menu_item_id: menuItemId, quantity: qty });
  if (res?.success) { cartData = res.data; updateSidebarCart(); }
}

function proceedToCheckout() {
  if (!Auth.requireLogin()) return;
  if (!cartData.items?.length) { showToast('Your cart is empty.', 'error'); return; }
  window.location.href = 'cart.html';
}

function scrollToCategory(id) {
  document.getElementById(id)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function calcPlatformFee(food) {
  const base = window._platformFeeBase ?? 5;
  return base + Math.floor(food / 100);
}

function escHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Init
Api.get('/settings/public').then(r => {
  const d = r?.data || {};
  if (d.platform_fee_base   !== undefined) window._platformFeeBase   = parseFloat(d.platform_fee_base);
  if (d.free_delivery_above !== undefined) window._freeDeliveryAbove = parseFloat(d.free_delivery_above);
  if (d.base_delivery_fee   !== undefined) window._baseDeliveryFee   = parseFloat(d.base_delivery_fee);
  loadCart();
});
function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function loadReviews() {
  const res = await Api.restaurants.reviews(restaurantId);
  const reviews = res?.data || [];
  if (!reviews.length) return;

  document.getElementById('reviewsSection').style.display = 'block';

  const avg = (reviews.reduce((s, r) => s + (r.food_rating || 0), 0) / reviews.length).toFixed(1);
  const stars = '★'.repeat(Math.round(avg)) + '☆'.repeat(5 - Math.round(avg));
  document.getElementById('reviewsRatingSummary').innerHTML = `
    <span style="font-size:22px;font-weight:800;color:#333">${avg}</span>
    <span style="color:#f5a623;font-size:16px">${stars}</span>
    <span style="font-size:13px;color:#999">(${reviews.length} review${reviews.length > 1 ? 's' : ''})</span>`;

  document.getElementById('reviewsList').innerHTML = reviews.map(r => {
    const filled = Math.round(r.food_rating || 0);
    const starsHtml = Array.from({length:5}, (_,i) =>
      `<span style="color:${i < filled ? '#f5a623' : '#ddd'};font-size:15px">★</span>`).join('');
    const date = new Date(r.created_at).toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'});
    const initials = (r.customer_name || '?').split(' ').map(w => w[0]).join('').toUpperCase().slice(0,2);
    return `
      <div style="background:#fff;border-radius:14px;padding:16px 18px;box-shadow:0 1px 6px rgba(0,0,0,.06)">
        <div style="display:flex;align-items:flex-start;gap:12px">
          <div style="width:38px;height:38px;border-radius:50%;background:#ff5722;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0">${initials}</div>
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">
              <div style="font-size:14px;font-weight:700;color:#333">${escHtml(r.customer_name || 'Customer')}</div>
              <div style="font-size:12px;color:#aaa">${date}</div>
            </div>
            <div style="margin:4px 0 8px">${starsHtml}</div>
            ${r.review_text ? `<div style="font-size:14px;color:#555;line-height:1.5">${escHtml(r.review_text)}</div>` : ''}
          </div>
        </div>
      </div>`;
  }).join('');
}

loadRestaurant();
loadMenu();
loadReviews();
document.getElementById('viewCartBtn').addEventListener('click', () => { window.location.href = 'cart.html'; });
</script>
</body>
</html>
