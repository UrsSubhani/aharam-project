<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23FF6B2B'/><text x='50' y='72' font-size='65' text-anchor='middle' fill='white' font-family='Arial,sans-serif' font-weight='bold'>A</text></svg>">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aharam Admin Console</title>
  <link rel="stylesheet" href="css/admin.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
</head>
<body>
<div class="layout">

  <!-- ── SIDEBAR ─────────────────────────────────────────── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      🍽 Aharam
      <small>Admin Console</small>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-item active" data-page="dashboard">
        <span class="nav-icon">📊</span> Dashboard
      </div>
      <div class="nav-item" data-page="restaurants">
        <span class="nav-icon">🏪</span> Restaurants
        <span class="nav-badge" id="pendingRestBadge" style="display:none">0</span>
      </div>
      <div class="nav-item" data-page="orders">
        <span class="nav-icon">📦</span> Orders
      </div>
      <div class="nav-item" data-page="users">
        <span class="nav-icon">👥</span> Users
      </div>
      <div class="nav-item" data-page="delivery">
        <span class="nav-icon">🛵</span> Delivery Partners
        <span class="nav-badge" id="pendingPartnerBadge" style="display:none">0</span>
      </div>
      <div class="nav-item" data-page="earnings">
        <span class="nav-icon">💰</span> Earnings
      </div>
      <div class="nav-item" data-page="settlements">
        <span class="nav-icon">🏦</span> Settlements
      </div>
      <div class="nav-item" data-page="categories">
        <span class="nav-icon">🏷</span> Menu Categories
      </div>
      <div class="nav-item" data-page="coupons">
        <span class="nav-icon">🎟</span> Coupons
      </div>
      <div class="nav-item" data-page="wallet">
        <span class="nav-icon">💳</span> Wallet
      </div>
      <div class="nav-item" data-page="settings">
        <span class="nav-icon">⚙️</span> Settings
      </div>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-avatar" id="avatarInitial">A</div>
        <div>
          <div class="sidebar-name" id="adminName">Admin</div>
          <div class="sidebar-role">Super Admin</div>
        </div>
      </div>
      <button class="logout-btn" onclick="Auth.logout()">Logout</button>
    </div>
  </aside>

  <!-- ── MAIN ────────────────────────────────────────────── -->
  <div class="main">
    <div class="topbar">
      <div class="topbar-title" id="pageTitle">Dashboard</div>
      <div class="topbar-right">
        <div class="topbar-date" id="todayDate"></div>
        <button class="btn btn-outline btn-sm" onclick="refreshPage()">🔄 Refresh</button>
      </div>
    </div>

    <div class="page-content" id="pageContent">
      <div class="empty-state"><div class="empty-icon">⏳</div><div class="empty-title">Loading…</div></div>
    </div>
  </div>
</div>

<!-- ── MODAL ────────────────────────────────────────────── -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Modal</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<script src="js/api-admin.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
